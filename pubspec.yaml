name: neuroread
description: "NeuroRead: evaluación y entrenamiento de la comprensión lectora."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/iconos/
    - assets/imagenes/
    - assets/libros/selva/
    - assets/libros/isla/
    - assets/libros/principe/
    - assets/fuentes/OFL-Jost.txt
    - assets/fuentes/OFL-ComicNeue.txt

  fonts:
    - family: Jost
      fonts:
        - asset: assets/fuentes/Jost-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Jost-Bold.ttf
          weight: 700
    - family: ComicNeue
      fonts:
        - asset: assets/fuentes/ComicNeue-Bold.ttf
          weight: 700
